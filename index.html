<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR-Relieve</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="stylesheet" href="TemplateData/diagnostics.css" />
    <script src="TemplateData/diagnostics.js"></script>
  </head>
  <body>
    <div id="app-container">
      <div id="loading-bar">
        <div id="progress-bar"></div>
      </div>
      <canvas id="render-canvas"></canvas>
      <div id="footer">
        <span id="app-title">VR-Relieve</span>
        <button id="fullscreen-button">Fullscreen</button>
        <img
          id="diagnostics-icon"
          src="TemplateData/webmemd-icon.png"
          alt="Diagnostics"
        />
      </div>
    </div>
    <script>
      const canvas = document.querySelector("#render-canvas");

      function showBanner(message, type) {
        const banner = document.createElement("div");
        banner.textContent = message;
        banner.style = `padding: 10px; color: ${
          type === "error" ? "red" : "yellow"
        }`;
        document.body.appendChild(banner);
        setTimeout(() => banner.remove(), 5000);
      }

      const buildPath = "Build";
      const config = {
        dataUrl: `${buildPath}/VRRelieve-WebGL.data`,
        frameworkUrl: `${buildPath}/VRRelieve-WebGL.framework.js`,
        codeUrl: `${buildPath}/VRRelieve-WebGL.wasm`,
        productName: "VR-Relieve",
        version: "0.1.0",
      };

      const script = document.createElement("script");
      script.src = `${buildPath}/VRRelieve-WebGL.loader.js`;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#progress-bar").style.width = `${
            progress * 100
          }%`;
        })
          .then((unityInstance) => {
            document.querySelector("#loading-bar").style.display = "none";
            document.querySelector("#fullscreen-button").onclick = () =>
              unityInstance.SetFullscreen(1);
            document.querySelector("#diagnostics-icon").onclick = () => {
              unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
            };
          })
          .catch((err) => {
            showBanner(`Error: ${err.message}`, "error");
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
